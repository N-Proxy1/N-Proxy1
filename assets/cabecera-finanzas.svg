<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0717"/>
      <stop offset="0.5" stop-color="#140d28"/>
      <stop offset="1" stop-color="#06140e"/>
    </linearGradient>

    <!-- Degradado del nombre que se desplaza para simular brillo -->
    <linearGradient id="nameGrad" x1="-1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.4" stop-color="#C4B5FD"/>
      <stop offset="0.6" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#A78BFA"/>
      <animate attributeName="x1" values="-1;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="trend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>

    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>

  <!-- Cuadrícula estática -->
  <g stroke="#A78BFA" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="52" x2="1000" y2="52"/>
    <line x1="0" y1="104" x2="1000" y2="104"/>
    <line x1="0" y1="156" x2="1000" y2="156"/>
    <line x1="0" y1="208" x2="1000" y2="208"/>
  </g>

  <!-- Velas que suben y bajan -->
  <g opacity="0.6">
    <rect x="60" y="150" width="18" height="50" fill="#22C55E">
      <animate attributeName="y" values="150;122;150" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="height" values="50;78;50" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="110" y="120" width="18" height="60" fill="#A78BFA">
      <animate attributeName="y" values="120;150;120" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="height" values="60;30;60" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="160" y="140" width="18" height="40" fill="#22C55E">
      <animate attributeName="y" values="140;110;140" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="height" values="40;70;40" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="820" y="90" width="18" height="70" fill="#22C55E">
      <animate attributeName="y" values="90;120;90" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="height" values="70;40;70" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="870" y="110" width="18" height="50" fill="#A78BFA">
      <animate attributeName="y" values="110;80;110" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="height" values="50;80;50" dur="4.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="920" y="70" width="18" height="60" fill="#22C55E">
      <animate attributeName="y" values="70;100;70" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="height" values="60;30;60" dur="3.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Línea de tendencia que se dibuja en bucle -->
  <polyline points="40,205 150,180 260,195 370,160 480,175 590,130 700,150 810,100 920,62 965,48"
            fill="none" stroke="url(#trend)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
            pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0.85">
    <animate attributeName="stroke-dashoffset" values="100;0;0" keyTimes="0;0.7;1" dur="6s" repeatCount="indefinite"/>
  </polyline>

  <circle cx="965" cy="48" r="5" fill="#22C55E">
    <animate attributeName="r" values="5;10;5" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Nombre -->
  <text x="500" y="128" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
        font-size="60" font-weight="bold" fill="url(#nameGrad)" filter="url(#glow)">Jonathan Núñez</text>

  <!-- Subtítulo que aparece y desaparece -->
  <text x="500" y="168" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
        font-size="20" fill="#C4B5FD">
    Ingeniería Comercial · Finanzas · Datos
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.25;0.8;1" dur="6s" repeatCount="indefinite"/>
  </text>

  <!-- Ticker en movimiento -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#22C55E">
    <text y="232">
      ▲ DATOS   ▲ FINANZAS   ▲ INVERSIONES   ▲ DECISIONES   ▲ DATOS   ▲ FINANZAS   ▲ INVERSIONES   ▲ DECISIONES
      <animate attributeName="x" values="0;-480" dur="14s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
